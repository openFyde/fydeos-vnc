description     "FydeOS LAN VNC server"
author          "alpha@fydeos.io"

# Boot-time auto-start: daemon claims its D-Bus name but stays Disabled
# until the toggle is flipped (via chrome://os-settings → Remote Access in
# M8, currently via dbus-send). The listening socket and capture pipeline
# only come up after SetEnabled(true).
start on started system-services
stop on stopping system-services

respawn
respawn limit 3 10

oom score -100

# M9 (a): seccomp + no_new_privs.
# M9b-1: + IPC / UTS / cgroup namespaces.
# M9b-2a: + mount namespace via minimalistic-mountns. Binds only what
# the daemon actually touches: D-Bus socket, /var/lib/fydeos-vnc (rw,
# stores cert/key/password), /dev/uinput, /dev/dri, /sys (DRM probe).
# Everything else inherits read-only via the / bind. UID switch + cap
# drop are M9b-2b.
#
#   -n              no_new_privs
#   -L              log seccomp denials
#   -l              new IPC namespace
#   --uts           new UTS namespace
#   -N              new cgroup namespace
#   -v -Kslave      new mount namespace, propagate as slave
#   --profile minimalistic-mountns: /, /proc, /dev/{null,zero,urandom},
#                   tmpfs /tmp
#   -k tmpfs,/run   writable tmpfs at /run (need /run/dbus inside it)
#   -b /run/dbus    bind D-Bus socket dir
#   -k tmpfs,/var   writable tmpfs at /var
#   -b /var/lib/fydeos-vnc,,1   cert/key/password persistence
#   -b /dev/uinput  pre-login input injection
#   -b /dev/dri     KMS capture device nodes
#   -b /sys         DRM / Mesa sysfs probing
# M9b-2b: + UID switch to dedicated `fydeos-vnc` user with supplementary
# `input` (for /dev/uinput) and `video` (for /dev/dri/*) groups. Drop
# all capabilities with -c 0.
#
#   -u/-g                primary user/group
#   --add-suppl-group    additional groups for device-node access
#   -c 0                 drop all capabilities (must follow uid change)
#   -S                   seccomp policy file
exec minijail0                                                              \
  -n                                                                        \
  -L                                                                        \
  -l                                                                        \
  --uts                                                                     \
  -N                                                                        \
  -v                                                                        \
  -Kslave                                                                   \
  --profile minimalistic-mountns                                            \
  -k 'tmpfs,/run,tmpfs,MS_NODEV|MS_NOEXEC|MS_NOSUID,mode=755,size=10M'      \
  -b /run/dbus                                                              \
  -k 'tmpfs,/var,tmpfs,MS_NODEV|MS_NOEXEC|MS_NOSUID,mode=755,size=10M'      \
  -b /var/lib/fydeos-vncd,,1                                                \
  -b /dev/uinput                                                            \
  -b /dev/dri                                                               \
  -b /sys                                                                   \
  -u fydeos-vnc                                                             \
  -g fydeos-vnc                                                             \
  --add-suppl-group uinput                                                  \
  --add-suppl-group video                                                   \
  -c 0                                                                      \
  -S /usr/share/policy/fydeos-vncd-seccomp.policy                           \
  -- /usr/sbin/fydeos-vncd
