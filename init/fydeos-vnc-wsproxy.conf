description     "FydeOS noVNC WebSocket proxy"
author          "alpha@fydeos.io"

# Track the main fydeos-vncd lifecycle. websockify is a stateless
# transcoder (WSS ↔ raw TCP), so it has no persistent state to lose
# when restarted. Cert/key files come from fydeos-vncd's state dir
# (already populated before this job runs).
start on started fydeos-vncd
stop on stopping fydeos-vncd

respawn
respawn limit 3 10

# Same OOM priority as the daemon; if the system is under memory
# pressure, killing wsproxy first only loses noVNC users (TigerVNC
# clients keep working through fydeos-vncd directly).
oom score -50

# websockify is a Python script and brings its own runtime. We give it
# the same self-signed cert pair fydeos-vncd uses so users only have
# to accept the fingerprint once; --web serves the noVNC static
# assets (HTML/JS) installed by www-apps/novnc; the target is the
# daemon's LAN-bound TCP listener — websockify connects from the
# device side, so 192.168.* is reached via the local routing table.
#
# The listen address is :: which is "any v6" but with v4-mapped
# fallback; permission_broker (held by fydeos-vncd) gates which
# external interfaces can reach 6080.
# Production images install websockify / novnc under /usr; the
# dev/test image uses /usr/local. Probe both so the same upstart
# conf works in either layout. A `script` block lets us exec the
# resolved path while keeping respawn semantics intact.
script
  WSBIN=/usr/bin/websockify
  [ -x "${WSBIN}" ] || WSBIN=/usr/local/bin/websockify
  NOVNC_WEB=/usr/share/novnc
  [ -d "${NOVNC_WEB}" ] || NOVNC_WEB=/usr/local/share/novnc
  exec "${WSBIN}"                                                   \
    --cert=/var/lib/fydeos-vncd/cert.pem                            \
    --key=/var/lib/fydeos-vncd/key.pem                              \
    --web="${NOVNC_WEB}"                                            \
    6080                                                            \
    127.0.0.1:5900
end script
