<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Copyright 2026 The FydeOS Authors
  Use of this source code is governed by a BSD-style license that can be
  found in the LICENSE file.

  Daemon runs as the dedicated `fydeos-vnc` user (M9b-2b) with `input`
  and `video` supplementary groups for /dev/uinput and /dev/dri.
-->
<busconfig>
  <policy user="fydeos-vnc">
    <allow own="org.fydeos.VncManager"/>
    <allow send_destination="org.fydeos.VncManager"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.fydeos.VncManager"/>
  </policy>
  <policy user="chronos">
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="SetEnabled"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="GetStatus"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="RegenerateCertificate"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="SetPassword"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="ClearPassword"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="SetInsecurePassword"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="ClearInsecurePassword"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="SetCaptureDisplay"/>
    <allow send_destination="org.fydeos.VncManager"
           send_interface="org.fydeos.VncManager"
           send_member="ListDisplays"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.fydeos.VncManager"/>
  </policy>
</busconfig>
