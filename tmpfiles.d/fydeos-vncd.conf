# Persistent state for fydeos-vncd: cert.pem, key.pem, password.
# Required to exist before the upstart job's minijail bind-mount of
# /var/lib/fydeos-vncd.
#
# Type  Path                       Mode  User  Group  Age  Arguments
d=      /var/lib/fydeos-vncd        0700  fydeos-vnc  fydeos-vnc  -  -
